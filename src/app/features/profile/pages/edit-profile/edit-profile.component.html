<div class="edit-profile">
  <div class="edit-profile__header">
    <a routerLink="/profile" class="edit-profile__back">
      <ds-icon name="chevronL" [size]="18" color="var(--dme-text)"/>
    </a>
    <div class="edit-profile__title">Editar perfil</div>
    <button
      type="button"
      class="edit-profile__save"
      [disabled]="saving() || loading()"
      (click)="save()">{{ saving() ? 'Guardando…' : 'Guardar' }}</button>
  </div>

  <!-- Avatar -->
  <div class="edit-profile__avatar-section">
    <div class="edit-profile__avatar">
      {{ (fullName() || email || '?').charAt(0).toUpperCase() }}
      <div class="edit-profile__avatar-edit">
        <ds-icon name="edit" [size]="14" color="#06201B"/>
      </div>
    </div>
    <div class="edit-profile__avatar-cta">Cambiar foto</div>
  </div>

  <div *ngIf="error()" class="edit-profile__error" role="alert">{{ error() }}</div>

  <!-- Form -->
  <div class="edit-profile__form" *ngIf="!loading(); else loadingTpl">
    <ds-input label="Nombre" icon="user" [editable]="true"
              [value]="fullName()" (valueChange)="fullName.set($event)"/>
    <ds-input label="Email" icon="note" [value]="email"/>

    <div class="edit-profile__row">
      <ds-input label="Peso (kg)" icon="weight" [editable]="true" type="text" inputmode="decimal"
                placeholder="—" [value]="weightKg()" (valueChange)="weightKg.set($event)"/>
      <ds-input label="Altura (cm)" icon="ruler" [editable]="true" type="text" inputmode="decimal"
                placeholder="—" [value]="heightCm()" (valueChange)="heightCm.set($event)"/>
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="edit-profile__loading">Cargando…</div>
  </ng-template>
</div>
