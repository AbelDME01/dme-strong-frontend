<div class="routines">
  <div class="routines__header">
    <h1 class="routines__title">Rutinas</h1>
    <div class="routines__fab" (click)="createRoutine()">
      <ds-icon name="plus" [size]="22" color="#06201B"/>
    </div>
  </div>

<div *ngIf="loading()" class="routines__skeletons">
  <ds-card *ngFor="let i of [1,2,3]" [raised]="true" [pad]="16">
    <div class="routines__skeleton-row">
      <ds-skeleton width="48px" height="48px" radius="14px"/>
      <div class="routines__skeleton-info">
        <ds-skeleton width="60%" height="15px" radius="6px"/>
        <ds-skeleton width="40%" height="12px" radius="5px" style="margin-top:8px"/>
        <div style="display:flex;gap:4px;margin-top:8px">
          <ds-skeleton width="72px" height="22px" radius="6px"/>
          <ds-skeleton width="60px" height="22px" radius="6px"/>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <ds-skeleton width="38px" height="38px" radius="12px"/>
        <ds-skeleton width="38px" height="38px" radius="12px"/>
      </div>
    </div>
  </ds-card>
</div>

  <div *ngIf="error()" class="routines__error">{{ error() }}</div>

  <div *ngIf="!loading() && muscleGroups().length > 1" class="routines__filters">
    <div class="routines__segment">
      <div *ngFor="let g of muscleGroups()"
           class="routines__seg-item"
           [class.routines__seg-item--active]="g === activeFilter()"
           (click)="activeFilter.set(g)">{{ g }}</div>
    </div>
  </div>

  <div *ngIf="!loading() && routines().length === 0" class="routines__empty">
    <ds-icon name="dumbbell" [size]="32" color="var(--dme-text-mute)"/>
    <p>Aún no tienes rutinas.</p>
    <ds-button icon="plus" (clicked)="createRoutine()">Crear rutina</ds-button>
  </div>

  <div *ngIf="!loading() && routines().length > 0 && filteredRoutines().length === 0" class="routines__empty">
    <ds-icon name="filter" [size]="32" color="var(--dme-text-mute)"/>
    <p>No hay rutinas con ese grupo muscular.</p>
  </div>

  <div class="routines__list">
    <ds-card *ngFor="let r of filteredRoutines(); let i = index" [raised]="true" [interactive]="true" [pad]="16">
      <div class="routines__item" (click)="editRoutine(r)">
        <div class="routines__icon" [style.background]="toneBg(toneForIndex(i))">
          <ds-icon name="dumbbell" [size]="22" [color]="toneColor(toneForIndex(i))"/>
        </div>
        <div class="routines__info">
          <div class="routines__name">{{ r.name }}</div>
          <div class="routines__details">
            <span><ds-icon name="dumbbell" [size]="12"/> {{ exerciseCount(r) }} {{ exerciseCount(r) === 1 ? 'ejercicio' : 'ejercicios' }}</span>
          </div>
          <div class="routines__exercise-names" *ngIf="exerciseCount(r) > 0">
            <span *ngFor="let n of visibleNames(r)" class="routines__exercise-chip">{{ n }}</span>
            <span *ngIf="extraCount(r) > 0" class="routines__exercise-chip routines__exercise-chip--more">+{{ extraCount(r) }}</span>
          </div>
        </div>
        <div class="routines__actions">
          <div class="routines__delete" (click)="deleteRoutine(r, $event)">
            <ds-icon name="trash" [size]="16" color="var(--dme-coral)"/>
          </div>
          <div class="routines__play"
               [class.routines__play--busy]="startingId() === r.id"
               (click)="startWorkout(r, $event)">
            <ds-icon name="play" [size]="16" color="var(--dme-mint)"/>
          </div>
        </div>
      </div>
    </ds-card>
  </div>

  <ds-modal
    [open]="routinePendingDeletion() !== null"
    title="Eliminar rutina"
    [message]="deleteModalMessage()"
    confirmText="Eliminar"
    cancelText="Cancelar"
    [danger]="true"
    (confirmed)="confirmDeleteRoutine()"
    (cancelled)="routinePendingDeletion.set(null)"/>
</div>
